<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Questions — CloudDocs AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="assets/config.js"></script>
</head>
<body>

<div class="container" style="padding-top:0;">
  <nav class="topnav">
    <a href="index.html" class="brand"><div class="brand-mark"><i data-lucide="cloud" style="width:16px;height:16px;color:white;"></i></div>CloudDocs AI</a>
    <div class="avatar"></div>
  </nav>

  <a href="dashboard.html" class="link-quiet" style="margin-bottom:16px;display:inline-flex;"><i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Back to Documents</a>

  <div class="chat-layout">
    <div>
      <div class="doc-card-mini" id="docCard">
        <div style="display:flex;align-items:center;gap:8px;"><i data-lucide="file-text" style="width:15px;height:15px;color:#E5493A;"></i><span id="docName">Loading...</span></div>
        <span class="badge ready" id="docBadge">Ready</span>
        <div class="date" id="docDate"></div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-messages" id="chatMessages">
        <div style="text-align:center;color:var(--slate-400);font-size:13px;padding:20px;">Ask a question about this document to get started.</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask a question...">
        <button class="send-btn" id="sendBtn"><i data-lucide="send" style="width:17px;height:17px;"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  lucide.createIcons();

  const params = new URLSearchParams(window.location.search);
  const documentId = params.get('id');
  const input = document.getElementById('chatInput');
  const messages = document.getElementById('chatMessages');
  const sendBtn = document.getElementById('sendBtn');

  async function loadDocument() {
    if (!documentId) return;
    try {
      const doc = await apiGetDocument(documentId);
      document.getElementById('docName').textContent = doc.filename;
      document.getElementById('docDate').textContent = `Uploaded ${new Date(doc.created_at).toLocaleDateString()}`;
      const badge = document.getElementById('docBadge');
      badge.textContent = doc.status === 'ready' ? 'Ready' : doc.status;
      badge.className = 'badge ' + (doc.status === 'ready' ? 'ready' : 'processing');
    } catch (err) {
      document.getElementById('docName').textContent = 'Could not load document';
    }
  }

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'msg-user';
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function addBotMessage(answer, sources) {
    const div = document.createElement('div');
    div.className = 'msg-bot';
    const sourcesHtml = sources && sources.length
      ? `<div class="source-box"><div class="label">📄 Source Passage</div>"${sources[0].text}"</div>`
      : '';
    div.innerHTML = `<div class="msg-bot-bubble">${answer}</div>${sourcesHtml}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  async function send() {
    const question = input.value.trim();
    if (!question || !documentId) return;
    addUserMessage(question);
    input.value = '';
    sendBtn.disabled = true;

    try {
      const result = await apiQuery(documentId, question);
      addBotMessage(result.answer, result.sources);
    } catch (err) {
      addBotMessage(`Something went wrong: ${err.message}`, []);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  loadDocument();
</script>
</body>
</html>
